[project]
name = "registry"
version = "0.0.0"
description = "A registry for activation-steering artifacts. Plurality is the product."
requires-python = ">=3.13"
dependencies = [
    "safetensors==0.8.0",
    "numpy==2.5.3",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
